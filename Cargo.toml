[package]
name = "eomer-srt-ocr"
version = "0.2.0"
description = "Extract burnt-in subtitles from video with a local llama.cpp VLM"
license = "MIT"
repository = ""
edition = "2024"

[[bin]]
name = "eomer-srt-ocr"
path = "src/main.rs"

[lib]
name = "eomer_srt_ocr"
path = "src/lib.rs"

[features]
default = []
# The `serve` subcommand: HTTP API plus the embedded browser UI. Off by
# default so the ordinary CLI build stays small and carries no async runtime.
http = ["dep:axum", "dep:tokio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Pulled in only with `--features http`.
axum = { version = "0.8.9", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
serde_json = "1"
